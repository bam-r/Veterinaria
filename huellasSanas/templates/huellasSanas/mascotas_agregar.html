HTML
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar mascota | Huellas Sanas</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 35px 16px;
            background: #f5f7f5;
            color: #26352d;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 580px;
            margin: 20px auto;
            background: white;
            border: 1px solid #e3e9e4;
            border-radius: 16px;
            padding: 32px;
        }
        a { color: #26745b; text-decoration: none; }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #748078; margin-bottom: 28px; }
        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin: 18px 0 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7dfd8;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus {
            outline: 2px solid #a9d7bf;
            border-color: #26745b;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        button, .cancel {
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            border: 0;
            background: #26745b;
            color: white;
        }
        .cancel {
            background: #f0f3f0;
            color: #34443a;
        }
    </style>
</head>
<body>
    <main class="container">
        <a href="{% url 'inicio' %}">← Volver al panel</a>

        <h1>Registrar mascota</h1>
        <p class="subtitle">
            Completa los datos para registrar una nueva mascota.
        </p>

        <form method="POST" action="{% url 'mascotas_agregar' %}">
            {% csrf_token %}

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre"
                   maxlength="50" required>

            <label for="especie">Especie</label>
            <input type="text" id="especie" name="especie"
                   maxlength="30" placeholder="Ej. Perro, gato"
                   required>

            <label for="raza">Raza</label>
            <input type="text" id="raza" name="raza"
                   maxlength="30" required>

            <label for="dueño">Nombre del dueño</label>
            <input type="text" id="dueño" name="dueño"
                   maxlength="50" required>

            <div class="actions">
                <button type="submit">Guardar mascota</button>
                <a class="cancel" href="{% url 'inicio' %}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
